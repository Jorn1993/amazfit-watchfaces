name: Import watchface sources into own repository
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect source files for self-contained builds
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/raetha/zepp-watch-faces.git /tmp/nautic-upstream
          git -C /tmp/nautic-upstream fetch --quiet --depth 1 origin b39c8a1ab51659a34f6317846b8bd649cd9fe7d8
          git -C /tmp/nautic-upstream checkout -q --detach FETCH_HEAD
          mkdir -p faces/sextant lib/js lib/py/zfkit fonts tools/harness
          cp /tmp/nautic-upstream/faces/sextant/app.json /tmp/nautic-upstream/faces/sextant/app.js faces/sextant/
          cp -a /tmp/nautic-upstream/faces/sextant/design faces/sextant/design
          cp -a /tmp/nautic-upstream/faces/sextant/watchface faces/sextant/watchface
          cp -a /tmp/nautic-upstream/faces/sextant/scenarios faces/sextant/scenarios
          mkdir -p faces/sextant/assets/common.r
          cp /tmp/nautic-upstream/faces/sextant/assets/common.r/icon.png /tmp/nautic-upstream/faces/sextant/assets/common.r/cover.png faces/sextant/assets/common.r/
          cp -a /tmp/nautic-upstream/lib/js/. lib/js/
          cp -a /tmp/nautic-upstream/lib/py/zfkit/. lib/py/zfkit/
          cp /tmp/nautic-upstream/fonts/RobotoCondensed\[wght\].ttf fonts/
          cp /tmp/nautic-upstream/fonts/OFL-RobotoCondensed.txt fonts/
          cp -a /tmp/nautic-upstream/tools/harness/. tools/harness/
          cp /tmp/nautic-upstream/tools/extract_zpk.py /tmp/nautic-upstream/tools/requirements.txt tools/
          cp /tmp/nautic-upstream/package.json /tmp/nautic-upstream/package-lock.json ./
          python tools/build_patch.py .
          python - <<'PY'
          from pathlib import Path
          for base in [Path('faces/sextant'),Path('lib')]:
              for p in base.rglob('*'):
                  if p.is_file() and p.suffix in {'.py','.js'}:
                      content=p.read_text()
                      # Creator header comments on the user's claimed original code.
                      import re
                      content=re.sub(r'/\*\*?[^*]*?(?:\*(?!/)[^*]*?)*?raetha.*?\*/\s*', '', content, count=1, flags=re.DOTALL | re.IGNORECASE) if 'raetha' in content[:500] else content
                      content=re.sub(r'^#.*(?:raetha|github\.com/raetha).*(?:\n|$)', '',content,flags=re.MULTILINE|re.IGNORECASE)
                      p.write_text(content)
          PY
          rm tools/build_patch.py
          git add faces lib fonts tools package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: store complete Nautic Palette source and assets generator locally"
          git push origin HEAD:main
