name: Build WatchWit and installation QR
# Preview source: visual-refinement-v0.3 (six-pod Dashboard with battery picker previews)

on:
  push:
    branches: [main]
    paths:
      - 'faces/**'
      - 'lib/**'
      - 'fonts/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchwit-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Zepp toolchain and image generator
        run: |
          python -m pip install -r tools/requirements.txt
          npm install --prefix zeus-cli @zeppos/zeus-cli@1.9.3
          ln -s @zeppos/zeus-cli/private-modules/zeppos-app-utils zeus-cli/node_modules/zeppos-app-utils
          npm ci

      - name: Generate new themes and preview assets
        run: |
          python faces/sextant/design/generate.py

      - name: Check all watchface scenarios
        run: npm test

      - name: Compile the 480×480 ZPK
        run: |
          (cd faces/sextant && ../../zeus-cli/node_modules/.bin/zeus build)
          mkdir -p site/nautic-palette
          python tools/extract_zpk.py faces/sextant/dist site/nautic-palette/nautic-palette.zpk
          python - <<'PY'
          import io,json,zipfile
          from pathlib import Path
          p=Path('site/nautic-palette/nautic-palette.zpk')
          with zipfile.ZipFile(p) as z:
              with zipfile.ZipFile(io.BytesIO(z.read('device.zip'))) as device:
                  m=json.loads(device.read('app.json'))
                  assert m['app']['appName']=='WatchWit v0.2.1'
                  assert m['app']['appId']==21319240
                  assert m['app']['version']['name']=='0.2.1'
                  assert m['app']['version']['code']==5
                  assert 11141376 in [x.get('deviceSource') for x in m['platforms']]
                  assets=device.namelist()
                  for theme in ['color','mono','mix','blue','green','purple','orange','pink','night']:
                      assert f'assets/time/{theme}/0.png' in assets,theme
          print('Verified device package:',p,p.stat().st_size,'bytes')
          PY

      - name: Generate Zepp installation QR and install page
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, qrcode, re, html
          from PIL import Image, ImageDraw, ImageFont

          manifest=json.loads(Path('faces/sextant/app.json').read_text())
          name=manifest['app']['appName'].rsplit(' v',1)[0]
          version=manifest['app']['version']['name']
          slug=re.sub(r'[^A-Za-z0-9]+','-',name).strip('-')
          filename=f'{slug}-v{version}-QR.png'
          folder=Path('site/nautic-palette')
          folder.mkdir(parents=True, exist_ok=True)
          payload='zpkd1://jorn1993.github.io/amazfit-watchfaces/nautic-palette/nautic-palette.zpk'

          qr=qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=12,border=4)
          qr.add_data(payload)
          qr.make(fit=True)
          qr_img=qr.make_image(fill_color='#111827',back_color='white').convert('RGB')
          qr_img.save(folder/'install-qr.png')
          # Gallery-ready QR image: name and version are visible inside the PNG.
          w=max(qr_img.width,720)
          canvas=Image.new('RGB',(w,qr_img.height+180),'white')
          canvas.paste(qr_img,((w-qr_img.width)//2,150))
          d=ImageDraw.Draw(canvas)
          font_dir=Path('/usr/share/fonts/truetype/dejavu')
          large=ImageFont.truetype(str(font_dir/'DejaVuSans-Bold.ttf'),40)
          small=ImageFont.truetype(str(font_dir/'DejaVuSans.ttf'),26)
          d.text((w//2,35),name,font=large,anchor='mt',fill='#111827')
          d.text((w//2,95),f'Version {version}',font=small,anchor='mt',fill='#475569')
          canvas.save(folder/filename,optimize=True)
          assert (folder/filename).exists()
          (Path('site')/'.nojekyll').write_text('')
          page=f"""<!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{html.escape(name)} v{html.escape(version)} — Install</title>
          <style>
          body{{font:16px system-ui,sans-serif;max-width:650px;margin:4rem auto;padding:1.2rem;color:#ecf2fa;background:#101724;line-height:1.6}}
          h1{{margin-bottom:.1rem}}.version{{margin-top:0;color:#aebfd6}}
          a{{color:#8ab4ff}}img{{max-width:min(100%,360px);border-radius:12px}}
          .button{{display:inline-block;text-decoration:none;background:#3b82f6;color:white;padding:.85rem 1rem;border-radius:12px;margin:.2rem .4rem .2rem 0;font-weight:650}}
          .secondary{{background:#263246}}small{{color:#aebfd6}}
          </style></head><body><main>
          <h1>{html.escape(name)}</h1><p class="version">Version {html.escape(version)}</p>
          <p>Color, Mono, Mix, Blue, Green, Purple, Orange and Pink themes.</p>
          <h2>Install with Zepp</h2>
          <p>Enable Developer Mode in Zepp, then open your watch's Developer Mode and choose Scan.</p>
          <p><img src="nautic-palette/{filename}" alt="{html.escape(name)} version {html.escape(version)} installation QR code"></p>
          <p><a class="button" href="nautic-palette/{filename}" download="{filename}">Save QR to gallery</a>
          <a class="button secondary" href="nautic-palette/nautic-palette.zpk">Download ZPK</a></p>
          <p><small>On some phones the image opens instead of saving. Long-press it and select Save image or Download image.</small></p>
          </main></body></html>"""
          Path('site/index.html').write_text(page)
          print('QR download:',filename,'install URI:',payload)
          PY

      - name: Checkout visual redesign branch separately
        uses: actions/checkout@v4
        with:
          ref: visual-refinement-v0.3
          path: preview-source
          persist-credentials: false

      - name: Build installable WatchWit visual preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('preview-source/faces/sextant/app.json')
          data=json.loads(p.read_text())
          data['app']['appId']=21319241
          data['app']['appName']='WatchWit Dashboard v0.4.1'
          data['app']['version']={'code':3,'name':'0.4.1'}
          data['app']['description']='WatchWit Dashboard — independent watchface, currently an early design build.'
          for lang in data['i18n'].values():
              lang['appName']='WatchWit Dashboard v0.4.1'
          p.write_text(json.dumps(data,indent=2)+chr(10))
          PY
          python preview-source/faces/sextant/design/generate.py
          npm test --prefix preview-source
          (cd preview-source/faces/sextant && ../../../zeus-cli/node_modules/.bin/zeus build)
          mkdir -p site/preview
          python tools/extract_zpk.py preview-source/faces/sextant/dist site/preview/watchwit-preview.zpk
          cp site/preview/watchwit-preview.zpk site/preview/watchwit-dashboard-v0.4.1.zpk
          python - <<'PY'
          import io,json,zipfile
          from pathlib import Path
          p=Path('site/preview/watchwit-preview.zpk')
          with zipfile.ZipFile(p) as z, zipfile.ZipFile(io.BytesIO(z.read('device.zip'))) as d:
              m=json.loads(d.read('app.json'))['app']
              assert m['appId']==21319241,m
              assert m['appName']=='WatchWit Dashboard v0.4.1',m
              assert m['version']['name']=='0.4.1',m
          print('Validated separate WatchWit preview package:',p.stat().st_size,'bytes')
          PY

      - name: Generate independent preview QR and installation page
        run: |
          python - <<'PY'
          import qrcode
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          folder=Path('site/preview')
          payload='zpkd1://jorn1993.github.io/amazfit-watchfaces/preview/watchwit-dashboard-v0.4.1.zpk'
          qr=qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=12,border=4)
          qr.add_data(payload);qr.make(fit=True)
          src=qr.make_image(fill_color='#111827',back_color='white').convert('RGB')
          w=max(src.width,720)
          card=Image.new('RGB',(w,src.height+180),'white')
          card.paste(src,((w-src.width)//2,150))
          dr=ImageDraw.Draw(card)
          fonts=Path('/usr/share/fonts/truetype/dejavu')
          dr.text((w//2,35),'WatchWit Dashboard',font=ImageFont.truetype(str(fonts/'DejaVuSans-Bold.ttf'),38),anchor='mt',fill='#111827')
          dr.text((w//2,95),'Version 0.4.1',font=ImageFont.truetype(str(fonts/'DejaVuSans.ttf'),26),anchor='mt',fill='#475569')
          card.save(folder/'WatchWit-Dashboard-v0.4.1-QR.png')
          (folder/'index.html').write_text("""<!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1"><title>WatchWit Dashboard v0.4.1</title>
          <style>body{font:16px system-ui;background:#101724;color:#ecf2fa;line-height:1.6;max-width:620px;padding:24px;margin:35px auto}
          img{width:min(100%,350px);border-radius:12px}a{color:#99c5ff}
          .button{display:inline-block;padding:12px 18px;margin:8px 8px 8px 0;border-radius:12px;background:#3076dd;color:white;text-decoration:none}</style></head>
          <body><h1>WatchWit Dashboard v0.4.1</h1><p>Early dashboard development build. Different watchface and app ID from stable WatchWit; concept layout still in progress.</p>
          <p><img src="WatchWit-Dashboard-v0.4.1-QR.png" alt="WatchWit Dashboard installation QR"></p>
          <p><a class="button" href="WatchWit-Dashboard-v0.4.1-QR.png" download="WatchWit-Dashboard-v0.4.1-QR.png">Save QR</a>
          <a class="button" href="watchwit-dashboard-v0.4.1.zpk">Download preview ZPK</a></p>
          <p>In Zepp Developer Mode, choose Scan and scan the QR from another screen.</p>
          <p><a href="../">Open WatchWit Classic</a></p></body></html>""")
          print(payload)
          PY

      - name: Upload installable files to the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: nautic-palette-release
          path: site/
          retention-days: 30
          if-no-files-found: error

      - name: Prepare GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy installer website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
