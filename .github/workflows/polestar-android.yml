name: Polestar Link Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/polestar-link
    paths:
      - 'polestar-link/android/**'
      - '.github/workflows/polestar-android.yml'

permissions:
  contents: write

concurrency:
  group: polestar-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          # Install modern Android command-line tools independently of the
          # hosted image PATH and retired SDK 'tools' package.
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-cmdline.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline.zip" -d "$RUNNER_TEMP/cmdline"
          mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent APK signing identity
        env:
          POLESTAR_SIGNING_B64: ${{ secrets.POLESTAR_SIGNING_B64 }}
        run: |
          if [ -z "$POLESTAR_SIGNING_B64" ]; then
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::POLESTAR_SIGNING_B64 is missing. No APK will be published until the private key is configured."
            echo "### Android signing needs one-time setup" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the POLESTAR_SIGNING_B64 repository secret. The workflow intentionally does not publish unsigned or randomly signed APKs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$POLESTAR_SIGNING_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey > /dev/null
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "Persistent Android signing identity loaded."
      - name: Unit tests and compile installable Android APK
        working-directory: polestar-link/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify persistent APK signing certificate
        if: env.SIGNING_READY == 'true'
        run: |
          apk="polestar-link/android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          digest="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" |
            awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr '[:upper:]' '[:lower:]')"
          expected="81923ecae0f2f7cf847b51dd84cf7f6564f99d43224663ff4442677523801db0"
          if [ "$digest" != "$expected" ]; then
            echo "::error::APK is not signed with the persistent Polestar Link certificate."
            exit 1
          fi
          echo "Verified stable APK signing certificate."
      - uses: actions/upload-artifact@v4
        if: env.SIGNING_READY == 'true'
        with:
          name: polestar-link-android-debug-apk
          path: polestar-link/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-install APK in project
        if: env.SIGNING_READY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p polestar-link/public
          cp polestar-link/android/app/build/outputs/apk/debug/app-debug.apk /tmp/polestar-link-android-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin feature/polestar-link
            stale="$(git diff --name-only "$GITHUB_SHA" origin/feature/polestar-link -- polestar-link/android/ .github/workflows/polestar-android.yml)"
            if [ -n "$stale" ]; then
              echo "Source changed after build; skip publishing obsolete APK."
              exit 0
            fi
            git reset --hard origin/feature/polestar-link
            mkdir -p polestar-link/public
            cp /tmp/polestar-link-android-debug.apk polestar-link/public/polestar-link-android-v0.4.0-debug.apk
            checksum="$(sha256sum /tmp/polestar-link-android-debug.apk | cut -d ' ' -f 1)"
            printf '{"versionCode":4,"versionName":"0.4.0","apkUrl":"https://raw.githubusercontent.com/Jorn1993/amazfit-watchfaces/feature/polestar-link/polestar-link/public/polestar-link-android-v0.4.0-debug.apk","sha256":"%s"}\n' "$checksum" > polestar-link/public/latest-android.json
            git add polestar-link/public/polestar-link-android-v0.4.0-debug.apk polestar-link/public/latest-android.json
            if git diff --cached --quiet; then
              echo "APK already published."
              exit 0
            fi
            git commit -m "build(polestar): publish Android developer APK [skip ci]"
            if git push origin HEAD:feature/polestar-link; then
              echo "APK published."
              exit 0
            fi
          done
          echo "Could not publish APK after three attempts"
          exit 1
