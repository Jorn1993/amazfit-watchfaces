name: Orbit visual geometry gate
on:
  push:
    branches: [watchwit-orbit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native screen regions and minimum spacing
        run: python3 tools/check_orbit_geometry.py
