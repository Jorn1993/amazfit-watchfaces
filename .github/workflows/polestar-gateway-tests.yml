name: Polestar gateway safety checks
on:
  push:
    branches: [feature/polestar-link]
    paths:
      - 'polestar-link/gateway/**'
      - '.github/workflows/polestar-gateway-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r polestar-link/gateway/requirements.txt
          cd polestar-link/gateway
          python -m unittest discover -p 'test_*.py' -v
          python -m compileall -q .
