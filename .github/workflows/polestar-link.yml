name: Build Polestar Link and QR
on:
  push:
    branches:
      - feature/polestar-link
    paths:
      - 'polestar-link/watch/**'
      - '.github/workflows/polestar-link.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polestar-link-build
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain and QR generator
        run: |
          python -m pip install qrcode[pil]
          npm install --prefix zeus-cli @zeppos/zeus-cli@1.9.3
          ln -s @zeppos/zeus-cli/private-modules/zeppos-app-utils zeus-cli/node_modules/zeppos-app-utils
          npm install --prefix polestar-link/watch
      - name: Check JavaScript syntax
        run: |
          node --check polestar-link/watch/app-side/index.js
          node --check polestar-link/watch/app-side/proto.js
          node --check polestar-link/watch/setting/index.js
          node --check polestar-link/watch/page/index.js
          node --check polestar-link/watch/app.js
      - name: Test vehicle protocol codecs
        run: node --test polestar-link/watch/tests/*.test.mjs
      - name: Create icon and build app
        run: |
          node polestar-link/watch/prepare-icons.mjs
          (cd polestar-link/watch && ../../zeus-cli/node_modules/.bin/zeus build)
      - name: Extract ZPK and create installation QR
        run: |
          python - <<'PY'
          import zipfile,io,json,qrcode
          from pathlib import Path
          dist=Path('polestar-link/watch/dist')
          builds=sorted(dist.glob('*.zab'),key=lambda x:x.stat().st_mtime)
          if not builds: raise RuntimeError('Zeus did not produce .zab')
          with zipfile.ZipFile(builds[-1]) as z:
              names=[n for n in z.namelist() if n.endswith('.zpk')]
              if not names: raise RuntimeError('ZAB missing ZPK')
              payload=z.read(names[0])
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              entries=archive.namelist()
              print('PACKAGE COMPONENTS:',[(n,archive.getinfo(n).file_size) for n in entries])
              assert 'device.zip' in entries,'No watch component'
              phone_entries=[n for n in entries if 'side' in n.lower() or 'setting' in n.lower() or 'phone' in n.lower()]
              print('PHONE/SERVICE COMPONENTS:',phone_entries)
              for name in phone_entries:
                  try:
                      with zipfile.ZipFile(io.BytesIO(archive.read(name))) as phone:
                          print('PHONE ZIP ENTRIES:',phone.namelist())
                          for entry in phone.namelist():
                              if entry.endswith('.json'):
                                  print('PHONE JSON:',entry,phone.read(entry)[:2200])
                  except zipfile.BadZipFile:
                      print('PHONE COMPONENT NOT ZIP:',name)

          # Analyze actual compiled device JavaScript, not only source syntax.
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              with zipfile.ZipFile(io.BytesIO(z.read('device.zip'))) as device:
                  print('DEVICE ENTRIES:',device.namelist())
                  scripts=[n for n in device.namelist() if n.endswith('.js') or n.endswith('.bin')]
                  for script in scripts:
                      b=device.read(script)
                      for needle in (b'module.exports',b'.exports=',b'exports=',b'exports.',b'require('):
                          hits=[i for i in range(len(b)) if b.startswith(needle,i)]
                          for i in hits[:6]:
                              print('JS PROBE',script,needle.decode(),i,
                                    repr(b[max(0,i-130):i+170]))
                      print('DEVICE SCRIPT SIZE',script,len(b))
                      import re
                      strings=[m.group().decode('ascii','ignore') for m in re.finditer(rb'[ -~]{5,}',b)]
                      print('DEVICE PRINTABLE STRINGS',script,strings[:80])
                      print('DEVICE WATCH KEYWORDS',script,[x[:200] for x in strings if 'exports' in x or 'module' in x or 'error' in x][:40])
          # The Zepp phone service must be in preview mode as well as the watch.
          # Previously only device.zip was converted, leaving app-side.zip in
          # production mode. That produced a watch UI without a live companion.
          with zipfile.ZipFile(io.BytesIO(payload)) as outer:
              contents={n:outer.read(n) for n in outer.namelist()}
          for component in ('device.zip','app-side.zip'):
              if component not in contents:
                  raise RuntimeError('Missing required component: '+component)
              with zipfile.ZipFile(io.BytesIO(contents[component])) as component_zip:
                  files={n:component_zip.read(n) for n in component_zip.namelist()}
              if 'app.json' not in files:
                  raise RuntimeError('Missing app.json in '+component)
              component_manifest=json.loads(files['app.json'])
              previous_mode=component_manifest.get('packageInfo',{}).get('mode')
              component_manifest.setdefault('packageInfo',{})['mode']='preview'
              files['app.json']=json.dumps(component_manifest,separators=(',',':')).encode()
              archive=io.BytesIO()
              with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as zipped:
                  for n,data in files.items():zipped.writestr(n,data)
              contents[component]=archive.getvalue()
              print('Converted',component,'from',previous_mode,'to preview')
          rebuilt=io.BytesIO()
          with zipfile.ZipFile(rebuilt,'w',zipfile.ZIP_DEFLATED) as outer:
              for n,data in contents.items():outer.writestr(n,data)
          payload=rebuilt.getvalue()
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              for component in ('device.zip','app-side.zip'):
                  with zipfile.ZipFile(io.BytesIO(z.read(component))) as inner:
                      manifest=json.loads(inner.read('app.json'))
                      assert manifest['app']['appId']==1098347,manifest
                      assert manifest['app']['appType']=='app',manifest
                      assert manifest['packageInfo']['mode']=='preview',manifest
                      assert manifest['app']['version']['name']==json.loads(Path('polestar-link/watch/app.json').read_text())['app']['version']['name'],manifest
                      assert manifest['module']['app-side']['path']=='app-side/index',manifest
                      assert manifest['module']['setting']['path']=='setting/index',manifest
                      if component=='app-side.zip':
                          assert 'setting.js' in inner.namelist(),'Missing settings UI'
                          assert 'app-side.js' in inner.namelist(),'Missing phone service'
                          sidecode=inner.read('app-side.js')
                          assert b'polestar.login.request' in sidecode,'Phone-side auth is missing'
          public=Path('polestar-link/public');public.mkdir(parents=True,exist_ok=True)
          version=manifest['app']['version']['name']
          (public/f'polestar-link-v{version}.zpk').write_bytes(payload)
          url=f'zpkd1://raw.githubusercontent.com/Jorn1993/amazfit-watchfaces/feature/polestar-link/polestar-link/public/polestar-link-v{version}.zpk'
          qr=qrcode.make(url)
          qr.save(public/f'install-qr-v{version}.png')
          qr.save(public/'install-qr.png')
          (public/'install-url.txt').write_text(url+'\n')
          print('Created package',len(payload),'bytes; QR payload:',url)
          PY
      - name: Commit compiled developer build and QR to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polestar-link/public/
          if ! git diff --cached --quiet; then
            git commit -m "build(polestar): publish developer ZPK and QR [skip ci]"
            # Source commits may have landed while the package was compiling.
            # Rebase the generated files onto the branch tip rather than
            # losing a successfully built ZPK to a non-fast-forward push.
            for attempt in 1 2 3; do
              git fetch origin feature/polestar-link
              git rebase origin/feature/polestar-link
              if git push origin HEAD:feature/polestar-link; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not publish ZPK after three rebased attempts" >&2
                exit 1
              fi
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polestar-link-developer-build
          path: polestar-link/public/
